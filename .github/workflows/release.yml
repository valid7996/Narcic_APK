name: Android Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools cmake;3.22.1'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --channel=0 \
            --install "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          sed -i '9a\    ndkVersion = "29.0.14206865"' V2rayNG/app/build.gradle.kts

      - name: Restore cached libhevtun
        id: cache-libhevtun-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/libs
          key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Build libhevtun
        if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
        run: |
          bash compile-hevtun.sh

      - name: Save libhevtun
        if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/libs
          key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Copy libhevtun
        run: |
          cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

      - name: Download libv2ray
        uses: robinraju/release-downloader@v1.13
        with:
          repository: 'patterniha/AndroidLibXrayLite'
          latest: true
          fileName: 'libv2ray.aar'
          out-file-path: V2rayNG/app/libs/

      # libv2ray.aar (Xray core) and psiphontunnel AAR both ship a gomobile
      # libgojni.so with DIFFERENT content (MD5-verified; zero shared bind
      # refs) — an APK can hold only one file of that name and the two bind
      # sets cannot be merged without a gomobile rebuild. Keep the Xray one
      # (core VPN engine); strip it from the Psiphon AAR so packaging never
      # sees a duplicate. Psiphon chain degrades cleanly at runtime:
      # PsiphonController loads ca.psiphon classes reflectively and reports a
      # clear connect-time error instead of crashing the app.
      - name: Deduplicate libgojni (keep Xray)
        run: |
          cd V2rayNG/app/libs
          mkdir -p /tmp/psi_patch
          cd /tmp/psi_patch
          unzip -o -q "$GITHUB_WORKSPACE/V2rayNG/app/libs/psiphontunnel-2.0.41.aar" -d psi
          rm -f psi/jni/*/libgojni.so
          rm -f "$GITHUB_WORKSPACE/V2rayNG/app/libs/psiphontunnel-2.0.41.aar"
          cd psi && zip -qr "$GITHUB_WORKSPACE/V2rayNG/app/libs/psiphontunnel-2.0.41.aar" . && cd ..
          echo "psiphon AAR libgojni count (expect 0):"
          unzip -l "$GITHUB_WORKSPACE/V2rayNG/app/libs/psiphontunnel-2.0.41.aar" | grep -c "libgojni" || true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper jar exists
        run: |
          if [ ! -s V2rayNG/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar missing (likely stripped by .gitignore) - regenerating it"
            GRADLE_VERSION=$(grep -oP 'gradle-\K[0-9.]+(?=-bin\.zip)' V2rayNG/gradle/wrapper/gradle-wrapper.properties)
            curl -sSL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
            unzip -q /tmp/gradle.zip -d /tmp
            cd V2rayNG
            /tmp/gradle-${GRADLE_VERSION}/bin/gradle wrapper --gradle-version "${GRADLE_VERSION}"
            cd ..
          fi
          ls -la V2rayNG/gradle/wrapper/

      - name: Decode Keystore
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > V2rayNG/app/release-key.jks

      - name: Validate Keystore
        run: |
          SIZE=$(stat -c%s V2rayNG/app/release-key.jks)
          echo "Decoded keystore size: ${SIZE} bytes"
          if [ "$SIZE" -lt 100 ]; then
            echo "::error::release-key.jks is only ${SIZE} bytes - the SIGNING_KEY secret is likely empty or wrong."
            exit 1
          fi
          keytool -list -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -keystore V2rayNG/app/release-key.jks > /dev/null || {
            echo "::error::release-key.jks could not be read as a keystore. The SIGNING_KEY secret does not decode to a valid .jks/.p12 file - re-encode it and update the secret (see chat for steps)."
            exit 1
          }
          echo "Keystore looks valid."

      - name: Build Release APK
        env:
          RELEASE_STORE_FILE: release-key.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd ${{ github.workspace }}/V2rayNG
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod 755 gradlew
          TAG_NAME="${{ github.ref_name }}"
          VERSION_NAME="${TAG_NAME#v}"
          VERSION_CODE="${{ github.run_number }}"
          echo "Building version $VERSION_NAME (code $VERSION_CODE)"
          ./gradlew assemblePlaystoreRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/V2rayNG/app/release-key.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} \
            -PNARCIC_VERSION_NAME="$VERSION_NAME" \
            -PNARCIC_VERSION_CODE="$VERSION_CODE"

      - name: Rename APKs
        run: |
          mkdir -p output
          cd ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/release
          ls -la
          for f in *arm64-v8a*.apk; do cp "$f" ${{ github.workspace }}/output/NarcicNG-arm64.apk; done
          for f in *armeabi-v7a*.apk; do cp "$f" ${{ github.workspace }}/output/NarcicNG-armeabi.apk; done
          for f in *universal*.apk; do cp "$f" ${{ github.workspace }}/output/NarcicNG-universal.apk; done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Narcic NG ${{ github.ref_name }}"
          body: |
            ## Narcic NG ${{ github.ref_name }}

            ### 📥 دانلود
            | فایل | توضیح |
            |------|-------|
            | `NarcicNG-arm64.apk` | اکثر گوشی‌های جدید (پیشنهادی) |
            | `NarcicNG-armeabi.apk` | گوشی‌های قدیمی‌تر |
            | `NarcicNG-universal.apk` | همه گوشی‌ها |

            ### 📢 پشتیبانی
            کانال تلگرام: [@Narcic_Support](https://t.me/Narcic_Support)
          files: |
            output/NarcicNG-arm64.apk
            output/NarcicNG-armeabi.apk
            output/NarcicNG-universal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
