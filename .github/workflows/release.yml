name: Android Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # The Go line the Psiphon client's go.mod asks for, which also covers lyrebird's older one;
      # aether/psiphon-build.sh and aether/pt-build.sh pin the programs themselves. Bump it when a
      # bumped aether submodule pins a program that asks for a newer line.
      GO_VERSION: "1.26"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools cmake;3.22.1'

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          # The client is built from a checkout of its own; there is no go.sum here to cache by.
          cache: false

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --channel=0 \
            --install "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          sed -i '9a\    ndkVersion = "29.0.14206865"' V2rayNG/app/build.gradle.kts

      - name: Restore cached libhevtun
        id: cache-libhevtun-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/libs
          key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Build libhevtun
        if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
        run: |
          bash compile-hevtun.sh

      - name: Save libhevtun
        if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/libs
          key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Copy libhevtun
        run: |
          cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          # The stable release aether's own release workflow built with; pinned so a new stable
          # release cannot change or break the release build on its own. Bump it together with
          # the aether submodule.
          toolchain: "1.98.1"
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Restore cached libaether
        id: cache-libaether-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/libs-aether
          key: libaether-${{ runner.os }}-${{ env.NDK_HOME }}-1.98.1-${{ hashFiles('.git/modules/aether/HEAD') }}-${{ hashFiles('compile-aether.sh') }}

      - name: Build libaether
        if: steps.cache-libaether-restore.outputs.cache-hit != 'true'
        run: |
          bash compile-aether.sh

      - name: Save libaether
        if: steps.cache-libaether-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/libs-aether
          key: libaether-${{ runner.os }}-${{ env.NDK_HOME }}-1.98.1-${{ hashFiles('.git/modules/aether/HEAD') }}-${{ hashFiles('compile-aether.sh') }}

      # The Aether core runs Psiphon as a program of its own, the psiphon-tunnel-core console client,
      # which the app ships beside the core as libpsiphon-tunnel-core.so; see compile-psiphon.sh.
      - name: Restore cached Psiphon client
        id: cache-psiphon-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/libs-psiphon
          key: psiphon-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('.git/modules/aether/HEAD') }}-${{ hashFiles('compile-psiphon.sh') }}

      - name: Build the Psiphon client
        if: steps.cache-psiphon-restore.outputs.cache-hit != 'true'
        run: |
          bash compile-psiphon.sh

      - name: Save the Psiphon client
        if: steps.cache-psiphon-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/libs-psiphon
          key: psiphon-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('.git/modules/aether/HEAD') }}-${{ hashFiles('compile-psiphon.sh') }}

      # Tor's bridges run through a pluggable transport, a program of its own: lyrebird, which aether
      # builds and the app ships beside the core as liblyrebird.so; see compile-pt.sh.
      - name: Restore cached pluggable transport
        id: cache-pt-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/libs-pt
          key: pt-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('.git/modules/aether/HEAD') }}-${{ hashFiles('compile-pt.sh') }}

      - name: Build the pluggable transport
        if: steps.cache-pt-restore.outputs.cache-hit != 'true'
        run: |
          bash compile-pt.sh

      - name: Save the pluggable transport
        uses: actions/cache/save@v4
        if: steps.cache-pt-restore.outputs.cache-hit != 'true'
        with:
          path: ${{ github.workspace }}/libs-pt
          key: pt-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('.git/modules/aether/HEAD') }}-${{ hashFiles('compile-pt.sh') }}

      - name: Stage the native libraries
        run: |
          mkdir -p ${{ github.workspace }}/V2rayNG/app/libs
          cp -r ${{ github.workspace }}/libs-aether/. ${{ github.workspace }}/V2rayNG/app/libs/
          cp -r ${{ github.workspace }}/libs-psiphon/. ${{ github.workspace }}/V2rayNG/app/libs/
          cp -r ${{ github.workspace }}/libs-pt/. ${{ github.workspace }}/V2rayNG/app/libs/

      # Psiphon's client starts with the newest server list the build could fetch, so a fresh install has
      # servers before it can reach the list on its own; see fetch-psiphon-servers.sh.
      - name: Fetch the Psiphon server list
        run: |
          bash fetch-psiphon-servers.sh

      - name: Download libv2ray
        uses: robinraju/release-downloader@v1.13
        with:
          repository: 'patterniha/AndroidLibXrayLite'
          latest: true
          fileName: 'libv2ray.aar'
          out-file-path: V2rayNG/app/libs/

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper jar exists
        run: |
          if [ ! -s V2rayNG/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar missing (likely stripped by .gitignore) - regenerating it"
            GRADLE_VERSION=$(grep -oP 'gradle-\K[0-9.]+(?=-bin\.zip)' V2rayNG/gradle/wrapper/gradle-wrapper.properties)
            curl -sSL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
            unzip -q /tmp/gradle.zip -d /tmp
            cd V2rayNG
            /tmp/gradle-${GRADLE_VERSION}/bin/gradle wrapper --gradle-version "${GRADLE_VERSION}"
            cd ..
          fi
          ls -la V2rayNG/gradle/wrapper/

      - name: Decode Keystore
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > V2rayNG/app/release-key.jks

      - name: Validate Keystore
        run: |
          SIZE=$(stat -c%s V2rayNG/app/release-key.jks)
          echo "Decoded keystore size: ${SIZE} bytes"
          if [ "$SIZE" -lt 100 ]; then
            echo "::error::release-key.jks is only ${SIZE} bytes - the SIGNING_KEY secret is likely empty or wrong."
            exit 1
          fi
          keytool -list -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -keystore V2rayNG/app/release-key.jks > /dev/null || {
            echo "::error::release-key.jks could not be read as a keystore. The SIGNING_KEY secret does not decode to a valid .jks/.p12 file - re-encode it and update the secret (see chat for steps)."
            exit 1
          }
          echo "Keystore looks valid."

      - name: Build Release APK
        env:
          RELEASE_STORE_FILE: release-key.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd ${{ github.workspace }}/V2rayNG
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod 755 gradlew
          TAG_NAME="${{ github.ref_name }}"
          VERSION_NAME="${TAG_NAME#v}"
          VERSION_CODE="${{ github.run_number }}"
          echo "Building version $VERSION_NAME (code $VERSION_CODE)"
          ./gradlew assemblePlaystoreRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/V2rayNG/app/release-key.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} \
            -PNARCIC_VERSION_NAME="$VERSION_NAME" \
            -PNARCIC_VERSION_CODE="$VERSION_CODE"

      - name: Rename APKs
        run: |
          mkdir -p output
          cd ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/release
          ls -la
          for f in *arm64-v8a*.apk; do cp "$f" ${{ github.workspace }}/output/NarcicNG-arm64.apk; done
          for f in *armeabi-v7a*.apk; do cp "$f" ${{ github.workspace }}/output/NarcicNG-armeabi.apk; done
          for f in *universal*.apk; do cp "$f" ${{ github.workspace }}/output/NarcicNG-universal.apk; done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Narcic NG ${{ github.ref_name }}"
          body: |
            ## Narcic NG ${{ github.ref_name }}

            ### 📥 دانلود
            | فایل | توضیح |
            |------|-------|
            | `NarcicNG-arm64.apk` | اکثر گوشی‌های جدید (پیشنهادی) |
            | `NarcicNG-armeabi.apk` | گوشی‌های قدیمی‌تر |
            | `NarcicNG-universal.apk` | همه گوشی‌ها |

            ### 📢 پشتیبانی
            کانال تلگرام: [@Narcic_Support](https://t.me/Narcic_Support)
          files: |
            output/NarcicNG-arm64.apk
            output/NarcicNG-armeabi.apk
            output/NarcicNG-universal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}